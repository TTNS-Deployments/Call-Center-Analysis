[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callcenter-core"
version = "0.1.0"
description = "Shared pipeline, AI clients and data access for the Call Center Analysis solution"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "requests>=2.31",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    "azure-storage-queue>=12.10",
    "azure-cosmos>=4.7",
    "azure-ai-textanalytics>=5.3",
    "azure-eventhub>=5.12",
    "openai>=1.40",
]

[project.scripts]
callcenter = "callcenter.cli:main"

[tool.setuptools.packages.find]
include = ["callcenter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
callcenter = ["prompts/*.md"]
