name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            Code/webapp/requirements.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Core tests (pipeline, mocks, ARM/parameter consistency)
        run: python -m pytest Code/core -q

      - name: Web app tests
        working-directory: Code/webapp
        run: |
          python manage.py check
          python manage.py test

      - name: Validate ARM template (decompile + build with Bicep)
        run: |
          mkdir -p "$RUNNER_TEMP/arm" && cp Deployment/ARM/azuredeploy.json "$RUNNER_TEMP/arm/"
          az bicep decompile --file "$RUNNER_TEMP/arm/azuredeploy.json"
          az bicep build --file "$RUNNER_TEMP/arm/azuredeploy.bicep" --stdout > /dev/null

      - name: Build packages
        run: Deployment/scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build/*.zip
          retention-days: 7
