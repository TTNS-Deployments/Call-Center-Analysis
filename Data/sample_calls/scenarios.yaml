# Synthetic English call scripts used in LOCAL MODE ONLY.
#
# `python -m callcenter seed` turns these into sample calls: a placeholder WAV file plus
# a metadata JSON file. The mock speech service returns the script as the transcript,
# so the whole pipeline (PII redaction, sentiment, LLM insights, QA, Parquet, UI) can be
# exercised without Azure keys. All names and numbers are fictitious.
#
# Line format: [speaker, text, tag]
#   tag "opt:<name>"  line is dropped for lower-quality calls (tests QA scoring)
#   tag "bad:<name>"  line is only included for a few poor-quality calls (compliance breach)
# Placeholders: {company} {agent} {customer} {phone} {card} {card4} {email} {account}
#               {ref} {dob} {amount} {address}

company: Northwind Services

agents:
